<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>개발사업 폴리곤 편집기</title>
<link rel="stylesheet" href="./polygon-editor.css?v=3">
<script src="../map-config.js"></script>
</head>
<body>
<header>
  <input id="file" type="file" accept=".geojson,.json">
  <select id="featureSelect" disabled><option>GeoJSON을 먼저 불러오세요</option></select>
  <button id="editBtn" disabled>경계 편집</button>
  <button id="moveBtn" disabled>전체 이동</button>
  <button id="addBtn" disabled>꼭짓점 추가</button>
  <button id="delBtn" disabled>꼭짓점 삭제</button>
  <button id="undoBtn" disabled>실행취소</button>
  <button id="saveBtn" disabled>GeoJSON 저장</button>
</header>
<div id="status">① development.geojson을 불러오세요. ② 개발지구를 고른 뒤 경계 편집을 누르세요.</div>
<div id="map"></div>
<script src="./polygon-editor.js?v=3"></script>
</body>
</html>
