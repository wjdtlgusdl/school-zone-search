<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>개발사업 폴리곤 편집기</title>
<link rel="stylesheet" href="./polygon-editor.css?v=5">
<script src="../map-config.js"></script>
</head>
<body>
<header>
  <input id="file" type="file" accept=".geojson,.json">
  <select id="projectSelect" disabled><option>① 개발사업 선택</option></select>
  <select id="featureSelect" disabled><option>② 경계/블록 선택</option></select>
  <button id="newBtn" disabled>＋ 새 경계 그리기</button>
  <button id="bgBtn" disabled>주변 경계 숨기기</button>
  <button id="finishBtn" hidden>그리기 완료</button>
  <button id="cancelNewBtn" hidden>그리기 취소</button>
  <button id="editBtn" disabled>경계 편집</button>
  <button id="moveBtn" disabled>전체 이동</button>
  <button id="addBtn" disabled>꼭짓점 추가</button>
  <button id="delBtn" disabled>꼭짓점 삭제</button>
  <button id="undoBtn" disabled>실행취소</button>
  <button id="saveBtn" disabled>GeoJSON 저장</button>
</header>
<div id="status">① development.geojson을 불러오세요. ② 개발사업 → 지구 전체 경계/블록을 차례로 선택하세요.</div>
<div id="map"></div>
<script src="./polygon-editor.js?v=5"></script>
</body>
</html>
