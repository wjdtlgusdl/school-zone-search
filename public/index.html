<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="화성·오산 초등학교 통학구역을 도로명주소 또는 지번으로 조회합니다.">
    <title>화성·오산 통학구역 조회</title>
    <link rel="stylesheet" href="/style.css?v=20260928-full-map1">
  
<style id="v28-map-ui-fix">
  /* 통학구역지도 제목: '지도' 한 글자/단어만 다음 줄로 떨어지는 현상 방지 */
  #fullMapTitle {
    white-space: nowrap;
    word-break: keep-all;
    font-size: clamp(20px, 3vw, 32px);
    line-height: 1.25;
  }

  /* 범례 색상칩은 외부/동적 스타일과 무관하게 항상 보이도록 고정 */
  .full-map-legend i.legend-normal,
  .full-map-legend i.legend-shared,
  .full-map-legend i.legend-middle-zone,
  .full-map-legend i.legend-middle-shared {
    display: inline-block !important;
    width: 14px !important;
    height: 10px !important;
    margin-right: 5px !important;
    border-radius: 3px !important;
    vertical-align: -1px !important;
    box-sizing: border-box !important;
    flex: 0 0 auto !important;
  }
  .full-map-legend i.legend-normal {
    background: #60a5fa !important;
    border: 2px solid #1d4ed8 !important;
  }
  .full-map-legend i.legend-shared {
    background: #c084fc !important;
    border: 2px dashed #7e22ce !important;
  }
  .full-map-legend i.legend-middle-zone {
    background: #34d399 !important;
    border: 2px solid #047857 !important;
  }
  .full-map-legend i.legend-middle-shared {
    background: #fb7185 !important;
    border: 2px dashed #be123c !important;
  }

  @media (max-width: 720px) {
    #fullMapTitle { font-size: clamp(17px, 5vw, 24px); }
  }
</style>

</head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="서비스 정보">
        <a class="brand" href="/" aria-label="화성·오산 통학구역 조회 홈">
          <span class="brand-mark" aria-hidden="true">초</span>
          <span class="brand-copy">
            <strong>통학구역 조회</strong>
            <span>화성·오산 초등학교</span>
          </span>
        </a>

        <div class="topbar-actions">
          <span class="data-chip" id="dataChip">자료 로딩 중</span>
          <button class="icon-button" type="button" id="themeToggle" aria-label="다크모드 전환">
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="search-panel" aria-label="검색">
          <div class="panel-heading">
            <p class="eyebrow">2026학년도 자료 기준</p>
            <h1>초등학교 통학구역 확인</h1>
          </div>
<form class="mode-panel" id="addressMode" autocomplete="off">
            <label class="field-label" for="addressInput">도로명 주소 또는 지번 주소</label>
            <div class="search-box">
              <div class="autocomplete" id="addressAutocomplete">
                <input id="addressInput" name="address" type="search" inputmode="search" placeholder="예: 동탄반석로 277 또는 오산동 540-15" aria-autocomplete="list" aria-expanded="false" aria-controls="addressSuggestions">
                <button class="clear-input-button" type="button" id="clearAddressInput" aria-label="주소 입력 지우기" hidden>×</button>
                <div class="suggestion-panel" id="addressSuggestions" role="listbox" hidden></div>
              </div>
              <button class="primary-button" type="submit">조회</button>
            </div>

            <label class="field-label" for="currentSchoolInput">현재 재학 중인 초등학교 (필요시 입력)</label>
            <div class="search-box school-compare-box">
              <input id="currentSchoolInput" name="currentSchool" type="search" inputmode="search" list="currentSchoolList" placeholder="예: 운암초" autocomplete="off">
              <datalist id="currentSchoolList"></datalist>
            </div>
            <p class="field-hint">통학구역과 재학학교를 비교한 뒤, 재학학교 기준 중입배정 범위를 함께 안내합니다.</p>
          </form>
<div class="notice-card" role="note">
            <strong>입력한 주소는 저장하지 않으며, 참고용으로 활용하시기 바랍니다.</strong>
            
          </div>
        </section>

        <section class="result-panel" aria-live="polite" aria-label="조회 결과">
          <div class="empty-state" id="emptyState">
            <div class="empty-visual" aria-hidden="true"></div>
            <h2>도로명주소 또는 지번주소를 입력해 주세요.</h2>
            <p>예: 동탄반석로 277, 오산동 540-15</p>
          </div>

          <div class="loading-state" id="loadingState" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span>자료를 확인하고 있습니다.</span>
          </div>

          <div class="results" id="results" hidden></div>
        </section>
</main>

    </div>

    <script src="/middle-data.js?v=20260917-integrated1" defer></script>
    <script src="/map-config.js?v=20260922-mapfix2" defer></script>
    <script src="/main.js?v=20260928-address-only-no-map-v32" defer></script>
  </body>
</html>
